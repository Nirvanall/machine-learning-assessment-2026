[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-ownership-service"
version = "3.0.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["steam_service"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-service.txt"]}
