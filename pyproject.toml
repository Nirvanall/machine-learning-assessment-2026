[tool.poetry]
readme = "README.md"
license = "Proprietary"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
steam-ownership-service = {path = "assessment_2_production", develop = true}
polars = ">=0.20.31"
seaborn = ">=0.13.2"
scikit-learn = ">=1.5.0"
numpy = ">=1.26.4"
pandas = ">=2.2.2"
pyarrow = ">=16.1.0"
jupyter = ">=1.0.0"
plotly = ">=5.22.0"
xgboost = ">=2.1.0"
imblearn = ">=0.0"
catboost = ">=1.2.8"
fastapi = ">=0.115"
uvicorn = ">=0.30"

onnx = ">=1.17"
onnxruntime = ">=1.20"
skl2onnx = ">=1.18"
PyJWT = {version = ">=2.10", extras = ["crypto"]}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.2"
pytest-cov = ">=5.0.0"
pytest-mock = ">=3.14.0"
ipykernel = ">=6.29.4"
nbstripout = ">=0.7.1"
jupytext = ">=1.16.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
